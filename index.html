<!DOCTYPE html>
<html lang="hy">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NovaPOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 25px;
        }

        .auth-box {
            max-width: 420px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.1);
        }

        .auth-box h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary {
            width: 100%;
            background: #2563eb;
            color: white;
            margin-top: 10px;
        }

        .secondary {
            width: 100%;
            background: #e5e7eb;
            margin-top: 10px;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .logout {
            background: #dc2626;
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-top: 8px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(200px, 1fr)
            );
            gap: 15px;
        }

        .product-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
        }

        .product-card h3 {
            margin-top: 0;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-stock {
            color: #555;
            margin-bottom: 10px;
        }

        .add-product-btn {
            width: 100%;
            background: #16a34a;
            color: white;
        }

        .add-product-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 14px 0;
        }

        .cart-item-info {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .cart-item-controls button {
            background: #e5e7eb;
        }

        .cart-item-controls button:last-child {
            background: #dc2626;
            color: white;
        }

        .cart-item-total {
            display: block;
            margin-top: 8px;
        }

        .cart-total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .sale-button {
            width: 100%;
            background: #16a34a;
            color: white;
            margin-top: 12px;
            font-size: 17px;
        }

        .clear-button {
            width: 100%;
            background: #dc2626;
            color: white;
            margin-top: 8px;
        }

        .search {
            margin-bottom: 20px;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #f3f4f6;
        }

        .sale-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .sale-item small {
            display: block;
            color: #777;
            margin-top: 4px;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ============================= -->
    <!-- AUTH -->
    <!-- ============================= -->

    <section id="auth-section">

        <div class="auth-box">

            <h2>🟢 NovaPOS</h2>

            <p>Մուտք գործիր կամ ստեղծիր հաշիվ</p>

            <input
                id="register-email"
                type="email"
                placeholder="Email"
            >

            <input
                id="register-password"
                type="password"
                placeholder="Գաղտնաբառ"
            >

            <button
                class="primary"
                onclick="registerUser()"
            >
                Գրանցվել
            </button>

            <button
                class="secondary"
                onclick="loginUser()"
            >
                Մուտք գործել
            </button>

            <div
                id="auth-status"
                class="status"
            >
                Firebase-ը բեռնվում է...
            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- APP -->
    <!-- ============================= -->

    <section
        id="app-section"
        class="hidden"
    >

        <header>

            <h1>NovaPOS</h1>

            <div>
                <span id="user-email"></span>

                <button
                    class="logout"
                    onclick="logoutUser()"
                >
                    Դուրս գալ
                </button>
            </div>

        </header>


        <div class="container">

            <!-- STATS -->

            <div class="stats">

                <div class="stat">
                    Այսօրվա վաճառքներ
                    <strong id="today-sales">
                        0
                    </strong>
                </div>

                <div class="stat">
                    Այսօրվա եկամուտ
                    <strong id="today-revenue">
                        0 ֏
                    </strong>
                </div>

                <div class="stat">
                    Ապրանքներ
                    <strong id="products-count">
                        0
                    </strong>
                </div>

            </div>


            <div class="dashboard">

                <!-- PRODUCTS -->

                <div class="panel">

                    <h2>📦 Ապրանքներ</h2>

                    <input
                        id="search-input"
                        class="search"
                        type="text"
                        placeholder="Փնտրել ապրանք կամ շտրիխկոդ..."
                    >

                    <div
                        id="products"
                        class="products"
                    ></div>

                </div>


                <!-- CART -->

                <div class="panel">

                    <h2>🛒 Զամբյուղ</h2>

                    <input
                        id="barcode-input"
                        type="text"
                        placeholder="Շտրիխկոդ..."
                    >

                    <div id="cart"></div>

                    <div class="cart-total">
                        Ընդհանուր՝
                        <span id="cart-total">
                            0 ֏
                        </span>
                    </div>

                    <button
                        class="sale-button"
                        onclick="completeSale()"
                    >
                        💳 Վաճառք
                    </button>

                    <button
                        class="clear-button"
                        onclick="clearCart()"
                    >
                        🗑 Դատարկել
                    </button>

                </div>

            </div>


            <!-- ADD PRODUCT -->

            <div
                class="panel"
                style="margin-top:20px;"
            >

                <h2>➕ Ավելացնել ապրանք</h2>

                <input
                    id="new-product-name"
                    type="text"
                    placeholder="Ապրանքի անուն"
                >

                <input
                    id="new-product-price"
                    type="number"
                    placeholder="Գին"
                >

                <input
                    id="new-product-barcode"
                    type="text"
                    placeholder="Շտրիխկոդ"
                >

                <input
                    id="new-product-stock"
                    type="number"
                    placeholder="Քանակ"
                >

                <button
                    class="primary"
                    onclick="createProductFromForm()"
                >
                    Ավելացնել ապրանք
                </button>

            </div>


            <!-- SALES -->

            <div
                class="panel"
                style="margin-top:20px;"
            >

                <h2>📊 Վաճառքների պատմություն</h2>

                <div id="sales-list"></div>

            </div>


            <!-- RESET -->

            <div
                class="panel"
                style="margin-top:20px;"
            >

                <button
                    class="danger"
                    onclick="resetNovaPOS()"
                >
                    ⚠️ Վերականգնել NovaPOS-ը
                </button>

            </div>

        </div>

    </section>


    <!-- APP JS -->

    <script src="./app.js"></script>

</body>
</html>
